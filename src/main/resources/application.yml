spring:
  application:
    name: sovereign-comm-platform
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
security:
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID}
    rp-name: ${WEBAUTHN_RP_NAME}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS}
app:
  security:
    bootstrap-token: ${BOOTSTRAP_TOKEN}
    token-pepper: ${TOKEN_PEPPER:}
    require-verified-devices-for-sessions: ${REQUIRE_VERIFIED_DEVICES_FOR_SESSIONS:false}
    session-idle-timeout-minutes: ${SESSION_IDLE_TIMEOUT_MINUTES:60}
    verifier:
      base-url: ${SECURITY_VERIFIER_BASE_URL:}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:600}
  governance:
    cql:
      max-query-chars: ${CQL_MAX_QUERY_CHARS:2000}
      max-results: ${CQL_MAX_RESULTS:100}
    smalltalk:
      enabled: ${SMALLTALK_GOVERNANCE_ENABLED:false}
      max-script-chars: ${SMALLTALK_MAX_SCRIPT_CHARS:2000}
  crypto:
    plaintext-rejected: true
  notifications:
    plaintext-previews-enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: prod
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
server:
  error:
    include-message: never
    include-stacktrace: never
app:
  security:
    require-verified-devices-for-sessions: true
    rate-limit:
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
