spring:
  application:
    name: sovereign-comm-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sovereign_comm}
    username: ${DATABASE_USERNAME:sovereign_comm}
    password: ${DATABASE_PASSWORD:sovereign_comm}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
security:
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: ${WEBAUTHN_RP_NAME:Sovereign Comm}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080}
app:
  security:
    bootstrap-token: ${BOOTSTRAP_TOKEN:}
  crypto:
    plaintext-rejected: true
  notifications:
    plaintext-previews-enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: prod
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
server:
  error:
    include-message: never
    include-stacktrace: never
