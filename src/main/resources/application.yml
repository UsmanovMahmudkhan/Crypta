spring:
  application:
    name: sovereign-comm-platform
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
security:
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID}
    rp-name: ${WEBAUTHN_RP_NAME}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS}
app:
  security:
    bootstrap-token: ${BOOTSTRAP_TOKEN}
  crypto:
    plaintext-rejected: true
  notifications:
    plaintext-previews-enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: prod
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
server:
  error:
    include-message: never
    include-stacktrace: never
