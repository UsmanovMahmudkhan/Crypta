apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crypta-security-verifier
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sovereign-comm
      app.kubernetes.io/component: security-verifier
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sovereign-comm
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
