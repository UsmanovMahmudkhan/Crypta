apiVersion: v1
kind: Secret
metadata:
  name: sovereign-comm-secrets
type: Opaque
stringData:
  DATABASE_URL: jdbc:postgresql://postgres.example.internal:5432/sovereign_comm
  DATABASE_USERNAME: sovereign_comm
  DATABASE_PASSWORD: replace-with-external-secret
  BOOTSTRAP_TOKEN: replace-with-one-time-bootstrap-token
  TOKEN_PEPPER: replace-with-32-plus-character-token-pepper
  VERIFIER_SIGNING_SECRET: replace-with-32-plus-character-verifier-secret
