apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sovereign-comm-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sovereign-comm
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
