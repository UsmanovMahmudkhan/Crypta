version: '3.8'

services:
  # ==============================================================================
  # Database Service (PostgreSQL 16)
  # ==============================================================================
  db:
    image: postgres:16-alpine
    container_name: sovereign-db
    environment:
      POSTGRES_DB: sovereign_comm
      POSTGRES_USER: sovereign_comm
      POSTGRES_PASSWORD: sovereign_comm
    ports:
      - "5433:5432"
