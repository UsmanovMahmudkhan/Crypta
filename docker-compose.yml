# Local development only. Production deployments should use the Kubernetes
# manifests under k8s/ with externally managed PostgreSQL and secrets.

services:
  # ==============================================================================
  # Database Service (PostgreSQL 16)
  # ==============================================================================
  db:
    image: postgres:16-alpine
    container_name: sovereign-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sovereign_comm}
      POSTGRES_USER: ${POSTGRES_USER:-sovereign_comm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sovereign_comm}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign_comm -d sovereign_comm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================================
  # Backend Service (Spring Boot Monolith)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovereign-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/sovereign_comm
      DATABASE_USERNAME: ${POSTGRES_USER:-sovereign_comm}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sovereign_comm}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Sovereign Comm}
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-http://localhost:8080}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-local-bootstrap-token-change-me}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

# ==============================================================================
# Persistent Volumes Configuration
# ==============================================================================
volumes:
  pgdata:
    driver: local
